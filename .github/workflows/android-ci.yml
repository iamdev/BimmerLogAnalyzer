name: Android CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── Inject credentials from GitHub Secrets ──────────────────────────
      - name: Create msal_config.json from secret
        run: |
          mkdir -p app/src/main/res/raw
          echo '${{ secrets.MSAL_CONFIG_JSON }}' > app/src/main/res/raw/msal_config.json
        # Secret MSAL_CONFIG_JSON = full JSON content of msal_config.json

      - name: Create google-services.json from secret
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json
        # Secret GOOGLE_SERVICES_JSON = full JSON content of google-services.json

      # ── Build ────────────────────────────────────────────────────────────
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # ── Lint ─────────────────────────────────────────────────────────────
      - name: Lint
        run: ./gradlew lintDebug --stacktrace
        continue-on-error: true

      # ── Upload artifacts ─────────────────────────────────────────────────
      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ github.run_number }}
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: app/build/reports/tests/
          retention-days: 7

      # ── PR comment with build summary ───────────────────────────────────
      - name: Comment APK download link on PR
        if: github.event_name == 'pull_request' && success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ✅ Build passed — Run #${{ github.run_number }}\n\n` +
                    `**APK:** [Download debug-apk-${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n\n` +
                    `**Commit:** \`${{ github.event.pull_request.head.sha }}\``
            })
